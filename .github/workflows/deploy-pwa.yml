name: Deploy PWA to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'src/dashboard/**'
      - 'package.json'
      - '.github/workflows/deploy-pwa.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare dist
        run: |
          mkdir -p dist
          cp -r src/dashboard/. dist/
          node - <<'NODE'
          const fs = require('node:fs')
          const version = require('./package.json').version
          const path = 'dist/index.html'
          const source = fs.readFileSync(path, 'utf8')
          const placeholder = '__PILOT_ASSET_GENERATION__'
          if (!source.includes(placeholder)) {
            throw new Error(`Missing ${placeholder} in ${path}`)
          }
          fs.writeFileSync(path, source.replaceAll(placeholder, version))
          NODE
          echo "Dashboard files:"
          ls -la dist/
          echo "Icons:"
          ls -la dist/icons/ 2>/dev/null || echo "(no icons dir)"

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
